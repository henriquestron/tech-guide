name: Robô Vendas (Puppeteer Heavy)

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada hora
  workflow_dispatch: 
    inputs:
      termo:
        description: 'Termo de busca manual'
        required: false
      categoria:
        description: 'Categoria'
        required: false
      subcategoria:
        description: 'Subcategoria'
        required: false

jobs:
  scraping-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Baixar Código
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm install puppeteer @supabase/supabase-js @google/generative-ai dotenv

      - name: 🤖 Rodar Robô
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Aqui passamos os inputs manuais para o script ler
          INPUT_TERMO: ${{ inputs.termo }}
          INPUT_CATEGORIA: ${{ inputs.categoria }}
          INPUT_SUBCATEGORIA: ${{ inputs.subcategoria }}
        run: node scripts/robo.js